name: Build XNU Kernel for Harpia

on:
  push:
    branches: [ darwin, main ]
    paths:
      - 'Kernel/**'
      - 'Libraries/**'
      - 'Frameworks/**'
      - 'Makefile'
      - '.github/workflows/kernel-build.yml'
  pull_request:
    branches: [ darwin, main ]
    paths:
      - 'Kernel/**'
      - 'Libraries/**'
      - 'Frameworks/**'
      - 'Makefile'
      - '.github/workflows/kernel-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - harpia-arm
          - harpia-arm64

permissions:
  contents: read
  packages: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: harpia-arm, arch: arm, platform: Harpia, arm_version: 7 }
          - { name: harpia-arm64, arch: arm64, platform: Harpia, arm_version: 11 }

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang lld llvm \
            bison flex libpng-dev libxml2-dev zlib1g-dev \
            libssl-dev python3 cpio rsync tzdata bc \
            gawk sed coreutils findutils diffutils grep gzip tar xz-utils bzip2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Kernel
        run: |
          TARGET_NAME=${{ matrix.target.name }}
          TARGET_ARCH=${{ matrix.target.arch }}
          TARGET_PLATFORM=${{ matrix.target.platform }}
          ARM_VERSION=${{ matrix.target.arm_version }}
          
          echo "Building XNU for $TARGET_NAME..."
          mkdir -p obj/$TARGET_NAME
          
          # Skip rebuilding gmake toolchain (use prebuilt)
          touch Developer/Default.xctoolchain/gmake/Makefile 2>/dev/null || true
          touch Developer/Default.xctoolchain/gmake/lib/Makefile 2>/dev/null || true
          
          export CC=clang CXX=clang++ LD=ld.lld
          
          if [ "$TARGET_ARCH" = "arm64" ]; then
            ARCH_FLAGS="-target arm64-apple-ios15.0"
            ARCH_CONFIGS="ARM64"
          else
            ARCH_FLAGS="-target arm-apple-ios15.0"
            ARCH_CONFIGS="ARM"
          fi
          
          make KERNEL_CONFIGS="$TARGET_PLATFORM" ARCH_CONFIGS="$ARCH_CONFIGS" \
            DARWIN_VERSION="19.6.0" TARGET_OS="iPhoneOS" IPHONEOS_DEPLOYMENT_TARGET="15.0" \
            ARM_VERSION="$ARM_VERSION" TARGET_ARCH="$TARGET_ARCH" CC="$CC" CXX="$CXX" LD="$LD" \
            ARCH_FLAGS="$ARCH_FLAGS" -j$(nproc) 2>&1 | tee build-$TARGET_NAME.log || true

      - name: Collect artifacts
        run: |
          TARGET_NAME=${{ matrix.target.name }}
          mkdir -p artifacts/$TARGET_NAME
          find . -name "mach_kernel*" -type f 2>/dev/null | head -5
          [ -f "build-$TARGET_NAME.log" ] && cp "build-$TARGET_NAME.log" "artifacts/$TARGET_NAME/" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-${{ matrix.target.name }}
          path: artifacts/${{ matrix.target.name }}/
          retention-days: 14

  build-all:
    runs-on: ubuntu-22.04
    if: github.event.inputs.target == 'all' || github.event.inputs.target == ''
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang lld llvm \
            bison flex libpng-dev libxml2-dev zlib1g-dev \
            libssl-dev python3 cpio rsync tzdata bc \
            gawk sed coreutils findutils diffutils grep gzip tar xz-utils bzip2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build HARPIA ARM
        run: |
          mkdir -p obj/harpia-arm
          touch Developer/Default.xctoolchain/gmake/Makefile 2>/dev/null || true
          touch Developer/Default.xctoolchain/gmake/lib/Makefile 2>/dev/null || true
          
          export CC=clang CXX=clang++ LD=ld.lld
          export ARCH_FLAGS="-target arm-apple-ios15.0" ARCH_CONFIGS="ARM"
          
          make KERNEL_CONFIGS="Harpia" ARCH_CONFIGS="$ARCH_CONFIGS" \
            DARWIN_VERSION="19.6.0" TARGET_OS="iPhoneOS" IPHONEOS_DEPLOYMENT_TARGET="15.0" \
            ARM_VERSION="7" TARGET_ARCH="arm" CC="$CC" CXX="$CXX" LD="$LD" \
            ARCH_FLAGS="$ARCH_FLAGS" -j$(nproc) 2>&1 | tee build-harpia-arm.log || true

      - name: Build HARPIA ARM64
        run: |
          mkdir -p obj/harpia-arm64
          touch Developer/Default.xctoolchain/gmake/Makefile 2>/dev/null || true
          touch Developer/Default.xctoolchain/gmake/lib/Makefile 2>/dev/null || true
          
          export CC=clang CXX=clang++ LD=ld.lld
          export ARCH_FLAGS="-target arm64-apple-ios15.0" ARCH_CONFIGS="ARM64"
          
          make KERNEL_CONFIGS="Harpia" ARCH_CONFIGS="$ARCH_CONFIGS" \
            DARWIN_VERSION="19.6.0" TARGET_OS="iPhoneOS" IPHONEOS_DEPLOYMENT_TARGET="15.0" \
            ARM_VERSION="11" TARGET_ARCH="arm64" CC="$CC" CXX="$CXX" LD="$LD" \
            ARCH_FLAGS="$ARCH_FLAGS" -j$(nproc) 2>&1 | tee build-harpia-arm64.log || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/harpia-arm artifacts/harpia-arm64
          [ -f "build-harpia-arm.log" ] && cp "build-harpia-arm.log" "artifacts/harpia-arm/" || true
          [ -f "build-harpia-arm64.log" ] && cp "build-harpia-arm64.log" "artifacts/harpia-arm64/" || true

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-harpia-all
          path: artifacts/
          retention-days: 14
