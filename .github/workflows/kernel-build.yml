name: Build XNU Kernel for Harpia

on:
  push:
    branches: [ darwin, main ]
    paths:
      - 'Kernel/**'
      - 'Libraries/**'
      - 'Frameworks/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/kernel-build.yml'
  pull_request:
    branches: [ darwin, main ]
    paths:
      - 'Kernel/**'
      - 'Libraries/**'
      - 'Frameworks/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/kernel-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - harpia-arm
          - harpia-arm64

permissions:
  contents: read
  packages: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: harpia-arm, arch: arm, platform: Harpia, arm_version: 7 }
          - { name: harpia-arm64, arch: arm64, platform: Harpia, arm_version: 11 }

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang lld llvm \
            bison flex libpng-dev libxml2-dev zlib1g-dev \
            libssl-dev python3 cpio rsync tzdata \
            gawk sed coreutils findutils diffutils grep gzip tar xz bzip2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure CMake
        run: |
          echo "Configuring CMake for ${{{{ matrix.target.name }}}}..."
          cmake -S . -B build-${{{{ matrix.target.name }}} -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTARGET_ARCH=${{{{ matrix.target.arch }}} \
            -DTARGET_PLATFORM=${{{{ matrix.target.platform }}} \
            -DARM_VERSION=${{{{ matrix.target.arm_version }}}

      - name: Build Kernel
        run: |
          echo "Building XNU for ${{{{ matrix.target.name }}}}..."
          cmake --build build-${{{{ matrix.target.name }}} -j$(nproc) 2>&1 | tee build-${{{{ matrix.target.name }}}.log

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/${{{{ matrix.target.name }}}
          find build-${{{{ matrix.target.name }}} -name "mach_kernel*" -type f 2>/dev/null | head -5
          [ -f "build-${{{{ matrix.target.name }}}.log" ] && cp "build-${{{{ matrix.target.name }}}.log" "artifacts/${{{{ matrix.target.name }}}/" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-${{{{ matrix.target.name }}}
          path: artifacts/${{{{ matrix.target.name }}}/
          retention-days: 14

  build-all:
    runs-on: ubuntu-22.04
    if: github.event.inputs.target == 'all' || github.event.inputs.target == ''
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang lld llvm \
            bison flex libpng-dev libxml2-dev zlib1g-dev \
            libssl-dev python3 cpio rsync tzdata \
            gawk sed coreutils findutils diffutils grep gzip tar xz bzip2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build HARPIA ARM
        run: |
          cmake -S . -B build-harpia-arm -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DTARGET_ARCH=arm \
            -DTARGET_PLATFORM=Harpia -DARM_VERSION=7
          cmake --build build-harpia-arm -j$(nproc) 2>&1 | tee build-harpia-arm.log || true

      - name: Build HARPIA ARM64
        run: |
          cmake -S . -B build-harpia-arm64 -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DTARGET_ARCH=arm64 \
            -DTARGET_PLATFORM=Harpia -DARM_VERSION=11
          cmake --build build-harpia-arm64 -j$(nproc) 2>&1 | tee build-harpia-arm64.log || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/harpia-arm artifacts/harpia-arm64
          [ -f "build-harpia-arm.log" ] && cp "build-harpia-arm.log" "artifacts/harpia-arm/" || true
          [ -f "build-harpia-arm64.log" ] && cp "build-harpia-arm64.log" "artifacts/harpia-arm64/" || true

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-harpia-all
          path: artifacts/
          retention-days: 14
